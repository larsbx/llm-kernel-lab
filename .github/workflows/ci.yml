name: llm-kernel-lab-audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e
        with:
          cache: true
      - name: Audit estate authority layout
        run: pixi run estate-audit
      - name: Run repository test lane
        run: pixi run test
