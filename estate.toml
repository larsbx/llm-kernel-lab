version = 1
template = "estate-repository-v1"

[repository]
id = "larsbx/llm-kernel-lab"
kind = "research"
lifecycle = "active"
default_branch = "main"
layout_status = "transitional"

[estate_tooling]
repository = "larsbx/finite-math-kernels"
path = "audit/estate_repository/v1"
revision = "7543130ccfa05a88b5ddbacb46d4371ac99c21f9"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

[[plane]]
id = "policy"
target = "policy"
authority = "governance"
required = true
current = ["research/tensor_frontier/estate-adoption.toml"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["lean"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["tensor_lab"]

[[plane]]
id = "generation"
target = "generation"
authority = "non_authoritative_oracle"
required = true
current = ["prover_loop"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["mojo"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["benchmarks"]
current_globs = ["research/tensor_frontier/*.md"]

[[plane]]
id = "conformance"
target = "conformance"
authority = "evidence"
required = true
current = ["tests"]

[[plane]]
id = "evidence"
target = "evidence"
authority = "evidence"
required = true
current = ["results", "problems"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools", "gpu"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["README.md", "docs"]

[[language]]
name = "Lean"
authority = "canonical"
roles = ["kernel", "proof_acceptance"]
acceptance_authority = true

[[language]]
name = "Python"
authority = "supporting"
roles = ["orchestration", "reference", "audit", "training"]
acceptance_authority = false

[[language]]
name = "Mojo"
authority = "supporting"
roles = ["oracle", "experiment", "benchmark"]
acceptance_authority = false

[[language]]
name = "Bash"
authority = "supporting"
roles = ["gpu_orchestration"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = [
  "separate candidate generation from the Lean verification adapter",
  "move exact tensor reference code under the reference plane",
  "move tensor discovery kernels under explicit oracle or experiment namespaces",
  "separate immutable benchmark inputs from generated evidence",
  "consume the shared estate audit by immutable revision",
]
