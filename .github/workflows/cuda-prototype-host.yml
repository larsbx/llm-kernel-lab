name: cuda-prototype-host

on:
  push:
  pull_request:

jobs:
  offline-compile-and-host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit stable prototype toolchain
        run: python -m pip install mojo==1.1.0 max==26.6.0 numpy==2.3.5 pytest==8.4.2
      - name: Require NVIDIA target compilation and host contract checks
        run: MOJO_CUDA_REQUIRED=1 python -m pytest -q tests/test_tensor_mode_gram_cuda.py -k 'not required_gpu'
