[workspace]
name = "llm-kernel-lab"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
modular = ">=26.6.0.dev2026090805,<27"
python = ">=3.11"
pytest = "*"

[tasks]
# One-time setup. Lean comes from elan (https://github.com/leanprover/elan),
# which must be on PATH; the Mathlib build is downloaded, not compiled.
prepare-model = "python tools/prepare_model.py"
lean-setup = { cmd = "lake exe cache get", cwd = "lean" }

# CPU defaults for a 16 GB box: Q4_K weights, batch 2, and 55% of memory to
# MAX so Lean + Mathlib (~3 GB) fits beside it. On a GPU drop the last three.
serve = """max serve --model models/deepseek-prover-v1.5-rl \
  --weight-path DeepSeek-Prover-V1.5-RL.Q4_K_M.gguf \
  --served-model-name deepseek-prover-v1.5-rl --quantization-encoding q4_k \
  --max-length 2048 --port 8000 \
  --devices cpu --max-batch-size 2 --device-memory-utilization 0.55"""

prove = "python -m prover_loop.run"
test = "python tools/audit_transcendentals.py && python -m pytest -q tests"\ntensor-audit = "python tools/audit_transcendentals.py"\ntensor-test = "python tools/audit_transcendentals.py && python -m pytest -q tests/test_tensor_lab_algebraic.py tests/test_tensor_lab_firewall.py"\ntensor-plan = "python benchmarks/tensor_frontier/harness.py --list"

# Fine-tuning lives in its own environments: MAX serves but has no training
# API. `train` is CPU PyTorch (enough to prove the pipeline on a tiny model);
# `train-cuda` is the same stack on CUDA for the real 7B adapter.
[feature.train.dependencies]
python = "3.12.*"
transformers = ">=4.50"
peft = "*"
trl = "*"
datasets = "*"
accelerate = "*"
pytest = "*"

[feature.cpu.dependencies]
pytorch-cpu = "*"

[feature.cuda.system-requirements]
cuda = "12"

[feature.cuda.dependencies]
pytorch-gpu = "*"

[feature.train.tasks]
train-lora = "python tools/train_lora.py"

[environments]
train = { features = ["train", "cpu"], no-default-feature = true }
train-cuda = { features = ["train", "cuda"], no-default-feature = true }
